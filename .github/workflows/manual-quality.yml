name: Manual quality checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: false
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test supervisor safeguards
        run: python3 -m unittest discover -s scripts -p test_claude_pilot.py -v
      - name: Test Flutter behavior
        run: flutter test --no-pub
      - name: Test browser behavior
        run: python3 scripts/check_browser.py
      - name: Build web
        run: flutter build web --no-pub
      - name: Save web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build
          path: build/web
          if-no-files-found: error
          retention-days: 7
